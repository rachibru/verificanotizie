name: Auto Generate Trust Certificates

on:
  schedule:
    # Controlla ogni 5 minuti i nuovi post sul feed di Blogger
    - cron: '*/5 * * * *'
  workflow_dispatch: # Permette l'avvio manuale da GitHub Actions

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Genera schede SHA-256 e registro
        run: python genera_trust.py

      - name: Commit e Push su GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff-index --quiet HEAD || git commit -m "Aggiornamento automatico schede Trust [skip ci]"
          git push
